#
# PLAN section 6 stage 8: a Windows build of the ci-release preset with the test suite, and the deployable
# folder as an artifact (windeployqt runs at build time; data/, sounds/ and the ORT + WebGPU DLLs land next
# to the executable). Model tests that need the GitHub-release files skip. Runs 2026-11-11: #1 Qt step (aqt note below), #2 MinGW picked up without vcvars (hence msvc-dev-cmd),
# #3 a Release-only C4189, #4 lint tools (note at the Test step); #5 green.
name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026 # VS 2026 Enterprise 18.11 / MSVC 14.51, the same toolset as the dev machine (PLAN section 8)
    timeout-minutes: 120
    env:
      VSLANG: "1033" # English compiler messages: Ninja's /showIncludes parsing depends on it
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vcpkg and verovio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt 6.12 moved the online repository to per-architecture folders (qt6_6120/qt6_6120_msvc2022_64),
      # which aqtinstall 3.3.0 (PyPI, 2025-06) cannot read: miurahr/aqtinstall#1047, fix pending in PR #1048.
      # Until that merges, aqt comes from the PR author's fork, pinned to a commit (2026-09-19).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qttools # Widgets/Svg/Network/PrintSupport/Test + windeployqt
          cache: true
          aqtsource: git+https://github.com/jdpurcell/aqtinstall.git@6f0f842da47c744cdc814cd94da9828d934d7bf0

      # restore + save instead of actions/cache: the post step of actions/cache only saves on success, and
      # the ~70 min vcpkg build (FFmpeg, FluidSynth, PortAudio ...) must survive a failure later in the job.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Cache downloads (soundfont, ONNX Runtime, WebGPU EP)
        uses: actions/cache@v4
        with:
          path: build/_downloads
          key: downloads-${{ hashFiles('cmake/Sounds.cmake', 'cmake/OnnxRuntime.cmake') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: MSVC environment (vcvars64)
        uses: ilammy/msvc-dev-cmd@v1 # vswhere -latest: the only VS on the image is 2026
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset ci-release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DPython3_EXECUTABLE="$(Get-Command python).Source"

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci-release

      # lint.format / lint.tidy are a dev-machine gate (cmake/Lint.cmake pins LLVM 23.1.4 at C:/Program Files/LLVM):
      # the runner's clang is LLVM 20 (VS 2026 bundle), which formats differently and takes minutes per file
      # in clang-tidy (run #4, 2026-11-11). tools/dev-build.bat runs both before every commit.
      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset ci-release --timeout 900 -E "^lint\."

      - name: Package
        shell: pwsh
        run: |
          $out = "CopyCoach-win64-${{ github.sha }}".Substring(0, 24)
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/ci-release/copycoach.exe $out
          Copy-Item build/ci-release/*.dll $out
          Copy-Item -Recurse build/ci-release/data $out/data
          Copy-Item -Recurse build/ci-release/sounds $out/sounds
          Copy-Item -Recurse build/ci-release/licenses $out/licenses
          Get-ChildItem build/ci-release -Directory | Where-Object { $_.Name -in @('platforms', 'imageformats', 'iconengines', 'styles', 'tls', 'networkinformation') } | ForEach-Object { Copy-Item -Recurse $_.FullName "$out/$($_.Name)" }
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CopyCoach-win64
          path: CopyCoach-win64-*.zip
          if-no-files-found: error
